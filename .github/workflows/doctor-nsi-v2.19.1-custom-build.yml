name: Doctor NSI v2.19.1 custom plugin build

on:
  push:
    branches:
      - feature/doctor-nsi-v2.19.1-custom-tools
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout custom branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feature/doctor-nsi-v2.19.1-custom-tools

      - name: Verify minimal custom delta
        shell: bash
        run: |
          set -euo pipefail
          BASE=c99edaf31ec46929d17efe2afa4364272957cdb8
          git merge-base --is-ancestor "$BASE" HEAD
          grep -q 'public static final String NAME = "code_review"' mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/tools/impl/CodeReviewTool.java
          grep -q 'catalogue.add(new CodeReviewTool())' mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/tools/BuiltInToolRegistrar.java
          grep -q 'startExclusive' mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/utils/BackgroundJobs.java
          grep -q '"code_review"' mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/tools/Toolsets.java
          grep -q 'catalogue.add(new ValidateFormModelTool())' mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/tools/BuiltInToolRegistrar.java
          test -z "$(git diff "$BASE"..HEAD -- mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/tools/impl/ValidateFormModelTool.java)"
          test -z "$(git diff "$BASE"..HEAD -- mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/utils/FormModelValidator.java)"
          git diff --check "$BASE"..HEAD

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Cache Tycho P2 repositories
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository/.cache/tycho
            ~/.m2/repository/p2
          key: ${{ runner.os }}-tycho-p2-${{ hashFiles('**/*.target') }}
          restore-keys: |
            ${{ runner.os }}-tycho-p2-

      - name: Set custom bundle version
        working-directory: mcp
        shell: bash
        run: |
          set -euo pipefail
          VERSION=2.19.1.1
          TYCHO=$(sed -n 's|.*<tycho\.version>\(.*\)</tycho\.version>.*|\1|p' bom/pom.xml)
          test -n "$TYCHO"
          mvn "org.eclipse.tycho:tycho-versions-plugin:$TYCHO:set-version"             -DnewVersion="$VERSION" --batch-mode --no-transfer-progress

      - name: Build and run unit tests
        env:
          MAVEN_OPTS: -Xmx3g -XX:+UseParallelGC
        run: |
          bash source/compile.sh             --version 2.19.1.1             --archive-prefix MCP-EDT-DoctorNSI.v             --output-dir "$GITHUB_WORKSPACE/dist"

      - name: Artifact class smoke
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_JAR=$(find mcp/repositories/com.ditrix.edt.mcp.server.repository/target/repository/plugins             -maxdepth 1 -type f -name 'com.ditrix.edt.mcp.server_*.jar' | head -n 1)
          test -n "$PLUGIN_JAR"
          jar tf "$PLUGIN_JAR" | grep -q 'com/ditrix/edt/mcp/server/tools/impl/CodeReviewTool.class'
          jar tf "$PLUGIN_JAR" | grep -q 'com/ditrix/edt/mcp/server/tools/impl/ValidateFormModelTool.class'
          jar tf "$PLUGIN_JAR" | grep -q 'com/ditrix/edt/mcp/server/utils/CodeReviewBridge.class'

      - name: Prepare evidence
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/dist/MCP-EDT-DoctorNSI.v2.19.1.1.zip"
          test -f "$ZIP"
          printf 'branch=%s\n' 'feature/doctor-nsi-v2.19.1-custom-tools' > BUILD_COMMIT.txt
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> BUILD_COMMIT.txt
          printf 'upstream_release=v2.19.1\n' >> BUILD_COMMIT.txt
          printf 'upstream_release_commit=%s\n' 'c99edaf31ec46929d17efe2afa4364272957cdb8' >> BUILD_COMMIT.txt
          printf 'bundle_version=2.19.1.1\n' >> BUILD_COMMIT.txt
          printf 'custom_delta=code_review + BackgroundJobs.startExclusive\n' >> BUILD_COMMIT.txt
          printf 'tests=source/compile.sh + artifact class smoke\n' >> BUILD_COMMIT.txt
          sha256sum "$ZIP" | tee BUILD_SHA256.txt

      - name: Upload update site artifact
        uses: actions/upload-artifact@v7
        with:
          name: MCP-EDT-DoctorNSI.v2.19.1.1.${{ github.run_id }}
          path: |
            dist/MCP-EDT-DoctorNSI.v2.19.1.1.zip
            BUILD_COMMIT.txt
            BUILD_SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish fork release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=doctor-nsi-v2.19.1.1
          ZIP=dist/MCP-EDT-DoctorNSI.v2.19.1.1.zip
          NOTES='Doctor NSI custom EDT-MCP build based exactly on upstream v2.19.1 (c99edaf31ec46929d17efe2afa4364272957cdb8). Custom delta: code_review plus owner-exclusive BackgroundJobs admission. Upstream validate_form_model and v2.19.1 DCS chart support are used unchanged.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" BUILD_COMMIT.txt BUILD_SHA256.txt --clobber
          else
            gh release create "$TAG" "$ZIP" BUILD_COMMIT.txt BUILD_SHA256.txt               --target "$GITHUB_SHA"               --title 'MCP-EDT DoctorNSI v2.19.1.1'               --notes "$NOTES"
          fi
