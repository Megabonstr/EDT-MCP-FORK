name: Doctor NSI custom plugin build

on:
  push:
    branches:
      - feature/doctor-nsi-custom-tools-upstream-2026-09-08
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout current upstream branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/doctor-nsi-custom-tools-upstream-2026-09-08

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Port verified Doctor NSI custom tools
        shell: bash
        run: |
          set -euo pipefail
          OLD_BRANCH='local/doctor-nsi-upstream-temp-2026-09-01'
          OLD_COMMIT='8125e7f7e28f21718ea07c597aed41e918f7aa96'
          git fetch origin "${OLD_BRANCH}:refs/remotes/origin/${OLD_BRANCH}"

          files=(
            'mcp/bundles/com.ditrix.edt.mcp.server/guides/code_review.md'
            'mcp/bundles/com.ditrix.edt.mcp.server/guides/validate_form_model.md'
            'mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/tools/impl/CodeReviewTool.java'
            'mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/tools/impl/ValidateFormModelTool.java'
            'mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/utils/BackgroundJobs.java'
            'mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/utils/CodeReviewBridge.java'
            'mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/utils/CodeReviewBridgeException.java'
            'mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/utils/CodeReviewReportMapper.java'
            'mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/utils/FormModelValidator.java'
            'mcp/tests/com.ditrix.edt.mcp.server.tests/src/com/ditrix/edt/mcp/server/tools/impl/CodeReviewToolTest.java'
            'mcp/tests/com.ditrix.edt.mcp.server.tests/src/com/ditrix/edt/mcp/server/tools/impl/ValidateFormModelToolTest.java'
            'mcp/tests/com.ditrix.edt.mcp.server.tests/src/com/ditrix/edt/mcp/server/utils/BackgroundJobsTest.java'
            'mcp/tests/com.ditrix.edt.mcp.server.tests/src/com/ditrix/edt/mcp/server/utils/FormModelValidatorTest.java'
            'tests/e2e/tools/test_code_review.py'
            'tests/e2e/tools/test_validate_form_model.py'
          )
          for f in "${files[@]}"; do
            mkdir -p "$(dirname "$f")"
            git show "${OLD_COMMIT}:${f}" > "$f"
          done

          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess

          OLD='8125e7f7e28f21718ea07c597aed41e918f7aa96'

          def replace_once(path, old, new, marker):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              if marker in s:
                  return
              if old not in s:
                  raise SystemExit(f'Expected integration anchor not found in {path}: {old!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          registrar='mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/tools/BuiltInToolRegistrar.java'
          replace_once(registrar,
              'import com.ditrix.edt.mcp.server.tools.impl.CleanProjectTool;\n',
              'import com.ditrix.edt.mcp.server.tools.impl.CleanProjectTool;\nimport com.ditrix.edt.mcp.server.tools.impl.CodeReviewTool;\n',
              'import com.ditrix.edt.mcp.server.tools.impl.CodeReviewTool;')
          replace_once(registrar,
              'import com.ditrix.edt.mcp.server.tools.impl.ValidateQueryTool;\n',
              'import com.ditrix.edt.mcp.server.tools.impl.ValidateFormModelTool;\nimport com.ditrix.edt.mcp.server.tools.impl.ValidateQueryTool;\n',
              'import com.ditrix.edt.mcp.server.tools.impl.ValidateFormModelTool;')
          replace_once(registrar,
              '        catalogue.add(new GetSymbolInfoTool());\n',
              '        catalogue.add(new GetSymbolInfoTool());\n        catalogue.add(new CodeReviewTool());\n',
              '        catalogue.add(new CodeReviewTool());')
          replace_once(registrar,
              '        catalogue.add(new ValidateXdtoPackageTool());\n',
              '        catalogue.add(new ValidateXdtoPackageTool());\n        catalogue.add(new ValidateFormModelTool());\n',
              '        catalogue.add(new ValidateFormModelTool());')

          group='mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/preferences/ToolGroup.java'
          replace_once(group,
              '        "validate_xdto_package"), //$NON-NLS-1$\n',
              '        "validate_xdto_package", "validate_form_model"), //$NON-NLS-1$ //$NON-NLS-2$\n',
              '"validate_xdto_package", "validate_form_model"')
          replace_once(group,
              '        "get_outgoing_structures", "go_to_definition", "get_symbol_info", //$NON-NLS-1$ //$NON-NLS-2$ //$NON-NLS-3$\n',
              '        "get_outgoing_structures", "go_to_definition", "get_symbol_info", //$NON-NLS-1$ //$NON-NLS-2$ //$NON-NLS-3$\n        "code_review", //$NON-NLS-1$\n',
              '        "code_review", //$NON-NLS-1$')

          toolsets='mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/tools/Toolsets.java'
          replace_once(toolsets,
              '            "get_content_assist", "validate_query"); //$NON-NLS-1$ //$NON-NLS-2$\n',
              '            "get_content_assist", "validate_query", "code_review"); //$NON-NLS-1$ //$NON-NLS-2$ //$NON-NLS-3$\n',
              '"get_content_assist", "validate_query", "code_review"')
          replace_once(toolsets,
              '        assign(FORMS,\n            "get_form_layout_snapshot", "get_form_screenshot", "get_template_screenshot"); //$NON-NLS-1$ //$NON-NLS-2$ //$NON-NLS-3$\n',
              '        assign(FORMS,\n            "validate_form_model", "get_form_layout_snapshot", "get_form_screenshot", //$NON-NLS-1$ //$NON-NLS-2$ //$NON-NLS-3$\n            "get_template_screenshot"); //$NON-NLS-1$\n',
              '"validate_form_model", "get_form_layout_snapshot"')
          p=Path(toolsets)
          s=p.read_text(encoding='utf-8')
          s=s.replace('            "Form and template rendering: form layout snapshot, form screenshot, template screenshot."); //$NON-NLS-1$\n',
                      '            "Managed-form validation, layout snapshot and screenshots."); //$NON-NLS-1$\n', 1)
          p.write_text(s, encoding='utf-8')

          golden=Path('tests/e2e/tools_list.golden.json')
          current=json.loads(golden.read_text(encoding='utf-8'))
          old=json.loads(subprocess.check_output(['git','show',f'{OLD}:tests/e2e/tools_list.golden.json'], text=True))
          wanted={'code_review','validate_form_model'}
          old_by_name={item.get('name'): item for item in old if item.get('name') in wanted}
          if set(old_by_name) != wanted:
              raise SystemExit(f'Missing custom tools in old golden list: {wanted-set(old_by_name)}')
          merged={item['name']: item for item in current}
          merged.update(old_by_name)
          result=[merged[name] for name in sorted(merged)]
          golden.write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git diff --check
          grep -q 'compare_configurations' mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/tools/Toolsets.java
          grep -q 'code_review' mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/tools/Toolsets.java
          grep -q 'validate_form_model' mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/tools/Toolsets.java

          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add \
              mcp/bundles/com.ditrix.edt.mcp.server/guides \
              mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/preferences/ToolGroup.java \
              mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/tools/BuiltInToolRegistrar.java \
              mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/tools/Toolsets.java \
              mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/tools/impl/CodeReviewTool.java \
              mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/tools/impl/ValidateFormModelTool.java \
              mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/utils/BackgroundJobs.java \
              mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/utils/CodeReviewBridge.java \
              mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/utils/CodeReviewBridgeException.java \
              mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/utils/CodeReviewReportMapper.java \
              mcp/bundles/com.ditrix.edt.mcp.server/src/com/ditrix/edt/mcp/server/utils/FormModelValidator.java \
              mcp/tests/com.ditrix.edt.mcp.server.tests/src/com/ditrix/edt/mcp/server/tools/impl/CodeReviewToolTest.java \
              mcp/tests/com.ditrix.edt.mcp.server.tests/src/com/ditrix/edt/mcp/server/tools/impl/ValidateFormModelToolTest.java \
              mcp/tests/com.ditrix.edt.mcp.server.tests/src/com/ditrix/edt/mcp/server/utils/BackgroundJobsTest.java \
              mcp/tests/com.ditrix.edt.mcp.server.tests/src/com/ditrix/edt/mcp/server/utils/FormModelValidatorTest.java \
              tests/e2e/tools/test_code_review.py \
              tests/e2e/tools/test_validate_form_model.py \
              tests/e2e/tools_list.golden.json
            git commit -m 'feat: port Doctor NSI custom tools onto upstream 2026-09-08 [doctor-nsi-port]'
            git push origin HEAD:feature/doctor-nsi-custom-tools-upstream-2026-09-08
          fi

      - name: Record exact build commit
        shell: bash
        run: |
          git rev-parse HEAD | tee BUILD_COMMIT.txt
          printf 'upstream_base=%s\n' 'c27258779ed8c727e5ab9949e5bb2f7aadff5982' >> BUILD_COMMIT.txt
          printf 'custom_source=%s\n' '8125e7f7e28f21718ea07c597aed41e918f7aa96' >> BUILD_COMMIT.txt

      - name: Maven verify
        run: mvn clean verify -B -DskipTests

      - name: Maven tests
        run: mvn test -B

      - name: Upload update site
        uses: actions/upload-artifact@v4
        with:
          name: edt-mcp-doctor-nsi-update-site-${{ github.run_id }}
          path: |
            mcp/features/com.ditrix.edt.mcp.update/target/repository
            BUILD_COMMIT.txt
          if-no-files-found: error
          retention-days: 30
