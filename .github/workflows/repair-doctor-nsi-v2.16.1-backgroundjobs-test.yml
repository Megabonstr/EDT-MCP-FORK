name: Preserve v2.16.1 BackgroundJobs coverage in Doctor NSI port

on:
  push:
    branches:
      - feature/doctor-nsi-v2.16.1-custom-tools
    paths:
      - .github/workflows/repair-doctor-nsi-v2.16.1-backgroundjobs-test.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feature/doctor-nsi-v2.16.1-custom-tools
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore release test and replay only Doctor NSI hardening test
        shell: bash
        run: |
          set -euo pipefail
          FILE='mcp/tests/com.ditrix.edt.mcp.server.tests/src/com/ditrix/edt/mcp/server/utils/BackgroundJobsTest.java'
          RELEASE='9e7e029b8b70aa8c868b04a9ffe91a95b48e6909'
          CUSTOM='515235050d624d7c171e3cb3246986d2b67db310'

          git checkout "$RELEASE" -- "$FILE"
          git show "$CUSTOM" -- "$FILE" | git apply --3way

          # Release coverage (#537) plus our owner-exclusive admission regression must coexist.
          grep -q 'testWorkArrivingAfterTheDeadlineIsRefusedTheCommit' "$FILE"
          grep -q 'deadlinePublished' "$FILE"
          grep -q 'testExclusiveOwnerAdmissionSurvivesIndependentCallers' "$FILE"
          git diff --check

          git rm .github/workflows/repair-doctor-nsi-v2.16.1-backgroundjobs-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'test: preserve v2.16.1 BackgroundJobs coverage with Doctor NSI hardening'
          git push origin HEAD:feature/doctor-nsi-v2.16.1-custom-tools
